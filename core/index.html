<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumen Core — RAG console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Aurora — graphite + luminous cyan telemetry */
    --bg: #0d0f10; --panel: #15181a; --panel-2: #1b1f22;
    --ink: #e8edf0; --ink-dim: #93a0a8; --ink-faint: #5d6a72;
    --line: #1f262a; --line-strong: #2d373c;
    --accent: #35e0d0; --accent-soft: rgba(53,224,208,0.12); --accent-ink: #5fe8da;
    --glow: 0 0 18px rgba(53,224,208,0.35);
    --mono: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--mono); font-size: 13.5px; -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: 312px 1fr; height: 100vh; overflow: hidden;
  }
  a { color: var(--accent); }

  /* ---- sidebar ---- */
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 18px 20px 14px; display: flex; align-items: center; gap: 9px; }
  .brand svg { color: var(--accent); filter: drop-shadow(var(--glow)); flex: none; }
  .brand b { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; color: var(--accent); text-shadow: var(--glow); }
  .brand span { font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 1.5px; margin-left: 2px; }

  .status { padding: 0 20px 14px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 10.5px; padding: 3px 9px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line-strong); color: var(--ink-dim); white-space: nowrap;
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip.on { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .chip.off { color: var(--ink-faint); }

  .setup {
    margin: 14px 20px 4px; padding: 11px 13px; border: 1px solid var(--line-strong); border-radius: 10px;
    background: var(--panel-2); font-size: 11.5px; color: var(--ink-dim); line-height: 1.6;
  }
  .setup b { color: var(--accent); display: block; margin-bottom: 3px; }
  .setup code { color: var(--ink); background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .setup button {
    margin-top: 9px; width: 100%; background: var(--accent); color: #042420; border: none; border-radius: 8px;
    padding: 8px; font-family: var(--mono); font-weight: 600; font-size: 12px; cursor: pointer;
  }
  .setup button:hover { filter: brightness(1.08); }
  .setup .bar { height: 4px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 9px; }
  .setup .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s; }

  .drop {
    margin: 16px 20px 12px; padding: 20px 14px; border: 1.5px dashed var(--line-strong); border-radius: 10px;
    text-align: center; color: var(--ink-dim); cursor: pointer; transition: all .15s; font-size: 12px;
  }
  .drop:hover, .drop.hot { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
  .drop input { display: none; }

  .idx { margin: 0 20px 12px; font-size: 11px; color: var(--ink-dim); line-height: 1.6; }
  .idx .bar { height: 4px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 7px; }
  .idx .bar > i { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 3px; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0%{margin-left:-40%} 100%{margin-left:100%} }

  .lib { flex: 1; overflow-y: auto; padding: 6px 12px 14px; min-height: 0; }
  .lib h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-faint); margin: 12px 8px 7px; }
  .book {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; font-size: 12.5px; margin-bottom: 2px;
  }
  .book:hover { background: var(--panel-2); }
  .book.sel { background: var(--accent-soft); border-color: var(--accent); }
  .book .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book .meta { font-size: 10px; color: var(--ink-faint); }
  .book.sel .meta { color: var(--accent-ink); }
  .book .del { color: var(--ink-faint); border: none; background: none; cursor: pointer; font-size: 13px; padding: 0 2px; }
  .book .del:hover { color: var(--accent); }

  /* ---- main ---- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .transcript { flex: 1; overflow-y: auto; padding: 30px 36px; min-height: 0; }
  .empty { margin-top: 15vh; text-align: center; }
  .hero-mark { color: var(--accent); filter: drop-shadow(var(--glow)); margin-bottom: 14px; }
  .hero-brand { font-size: 30px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; text-shadow: var(--glow); }
  .hero-tag { color: var(--ink-dim); margin-top: 12px; font-size: 13px; }
  .hero-sub { color: var(--ink-faint); margin-top: 20px; font-size: 11.5px; line-height: 1.9; }

  .turn { margin-bottom: 30px; max-width: 840px; }
  .q { font-weight: 600; color: var(--ink); margin-bottom: 12px; display: flex; gap: 9px; font-size: 14.5px; }
  .q::before { content: "›"; color: var(--accent); font-weight: 700; }
  .a { line-height: 1.75; color: var(--ink); white-space: pre-wrap; font-size: 13.5px; }
  .cref { color: var(--accent); cursor: pointer; vertical-align: super; font-style: normal; font-size: 0.72em; font-weight: 600; padding: 0 1px; text-decoration: none; }
  .cref:hover { text-decoration: underline; }

  .metrics { margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 11px; overflow: hidden; }
  .metrics .row { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .metrics .row:last-child { border-bottom: none; }
  .metrics .cell { padding: 9px 13px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 76px; }
  .metrics .cell:last-child { border-right: none; }
  .metrics .k { font-size: 9px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 1px; }
  .metrics .v { color: var(--ink); font-size: 13px; font-weight: 500; }
  .metrics .v.hi { color: var(--accent); font-weight: 600; }

  details.chunks { border-top: 1px solid var(--line); }
  details.chunks summary { padding: 9px 13px; cursor: pointer; color: var(--ink-dim); font-size: 11px; list-style: none; }
  details.chunks summary::-webkit-details-marker { display: none; }
  details.chunks summary::before { content: "+ "; color: var(--accent); font-weight: 600; }
  details.chunks[open] summary::before { content: "− "; }
  .chunk { padding: 8px 13px 10px; border-top: 1px dashed var(--line); font-size: 11.5px; color: var(--ink-dim); line-height: 1.55; }
  .chunk .h { color: var(--ink-faint); margin-bottom: 3px; }
  .chunk .score { color: var(--accent); font-weight: 600; }

  .composer { border-top: 1px solid var(--line); padding: 16px 24px 22px; background: var(--bg); }
  .composer-card {
    max-width: 860px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: 16px; padding: 12px 14px 10px; transition: border-color .15s;
  }
  .composer-card:focus-within { border-color: var(--accent); }
  .composer input {
    width: 100%; background: transparent; border: none; outline: none; color: var(--ink);
    font-family: var(--mono); font-size: 14px; padding: 4px 4px 9px;
  }
  .composer input::placeholder { color: var(--ink-faint); }
  .composer-foot { display: flex; align-items: center; justify-content: space-between; }
  .composer-hint { color: var(--ink-faint); font-size: 10.5px; letter-spacing: 0.3px; }
  .send {
    width: 31px; height: 31px; border-radius: 999px; background: var(--accent); color: #042420;
    border: none; cursor: pointer; font-size: 16px; font-weight: 700; display: grid; place-items: center; line-height: 1;
    box-shadow: var(--glow);
  }
  .send:hover:not(:disabled) { filter: brightness(1.1); }
  .send:disabled { opacity: .35; cursor: not-allowed; }
  .err { color: var(--accent); font-size: 12px; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 9px; border: 2px solid var(--panel); }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 6 16 3-8h4"/></svg>
    <b>Lumen</b><span>core · rag</span>
  </div>
  <div class="status" id="status"><span class="chip">connecting…</span></div>
  <div class="setup" id="setup" style="display:none"></div>
  <label class="drop" id="drop">
    <input type="file" id="file" accept="application/pdf" />
    drop a PDF or click to index
  </label>
  <div class="idx" id="idx" style="display:none"></div>
  <div class="lib" id="lib"></div>
</aside>
<main>
  <div class="transcript" id="transcript">
    <div class="empty" id="empty">
      <div class="hero-mark"><svg width="64" height="30" viewBox="0 0 120 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h22l9-16 18 32 10-24 7 12h50"/></svg></div>
      <div class="hero-brand">Lumen Core</div>
      <div class="hero-tag">grounded answers from your own PDFs.</div>
      <div class="hero-sub">
        index a PDF, then ask.<br/>
        every answer shows its sources and its latency.
      </div>
    </div>
  </div>
  <div class="composer">
    <div class="composer-card">
      <input id="input" placeholder="Message Lumen Core…" disabled autocomplete="off" />
      <div class="composer-foot">
        <span class="composer-hint">grounded · cited · timed</span>
        <button id="send" class="send" title="Send" disabled>↑</button>
      </div>
    </div>
  </div>
</main>

<script>
const API = ''; // same-origin (served from backend /core)
const ALL = '__all__';
let books = [], selected = '', busy = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => (s || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

async function loadStatus() {
  try {
    const [cfg, hw] = await Promise.all([
      fetch(API + '/api/rag/config').then((r) => r.json()),
      fetch(API + '/api/rag/hardware').then((r) => r.json()).catch(() => null),
    ]);
    const model = cfg.mode === 'local' ? (cfg.local && cfg.local.chatModel) : (cfg.api && cfg.api.chatModel);
    const chips = [];
    chips.push(`<span class="chip">mode <b>${esc(cfg.mode)}</b></span>`);
    chips.push(`<span class="chip">model <b>${esc(model || '—')}</b></span>`);
    if (hw) {
      chips.push(`<span class="chip ${hw.gpu ? 'on' : 'off'}">${hw.gpu ? 'GPU ' + esc(hw.gpuName || 'yes') : 'CPU only'}</span>`);
      if (hw.gpu && hw.vramMB) chips.push(`<span class="chip">${Math.round(hw.vramMB / 1024)}GB VRAM</span>`);
      if (!hw.gpu) chips.push(`<span class="chip">${hw.ramGB}GB RAM</span>`);
    }
    chips.push(`<span class="chip ${cfg.rerankActive ? 'on' : 'off'}">rerank ${cfg.rerankActive ? 'on' : 'off'}</span>`);
    $('status').innerHTML = chips.join('');
  } catch {
    $('status').innerHTML = '<span class="chip off">backend unreachable on :5001</span>';
  }
}

// Show a setup banner when local AI isn't ready: Ollama missing (point at the
// setup script), or models not yet pulled (offer a one-click download).
async function loadProvision() {
  const el = $('setup');
  try {
    const s = await fetch(API + '/api/rag/provision/status').then((r) => r.json());
    if (!s.ollamaInstalled) {
      el.style.display = 'block';
      el.innerHTML = '<b>Local AI not installed</b>Ollama isn’t installed. Run <code>npm run setup</code> in the project (or install from <a href="https://ollama.com/download" target="_blank">ollama.com</a>), then reload.';
    } else if (s.missing && s.missing.length) {
      el.style.display = 'block';
      el.innerHTML = `<b>Set up local AI</b>Missing: ${s.missing.map(esc).join(', ')}<button id="provBtn">Download &amp; run (${s.missing.length})</button>`;
      $('provBtn').onclick = runProvision;
    } else {
      el.style.display = 'none';
    }
  } catch { el.style.display = 'none'; }
}

async function runProvision() {
  const el = $('setup');
  el.innerHTML = '<b>Setting up local AI…</b><div id="provMsg">starting…</div><div class="bar"><i id="provBar"></i></div>';
  try {
    const r = await fetch(API + '/api/rag/provision', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    const msg = (t) => { const m = $('provMsg'); if (m) m.textContent = t; };
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const evts = buf.split('\n\n'); buf = evts.pop();
      for (const evt of evts) {
        const ev = evt.split('\n').find((l) => l.startsWith('event: '))?.slice(7);
        const dl = evt.split('\n').find((l) => l.startsWith('data: '))?.slice(6);
        if (!dl) continue;
        let j; try { j = JSON.parse(dl); } catch { continue; }
        if (ev === 'status') msg(j.message || j.phase || '');
        else if (ev === 'model') msg(`${j.model} ${j.state === 'done' ? 'ready' : 'downloading…'}`);
        else if (ev === 'progress') { msg(`${j.model}: ${j.status}${j.percent != null ? ' ' + j.percent + '%' : ''}`); if (j.percent != null && $('provBar')) $('provBar').style.width = j.percent + '%'; }
        else if (ev === 'done') { el.style.display = 'none'; loadStatus(); loadBooks(); }
        else if (ev === 'error') { el.innerHTML = `<b>Setup failed</b>${esc(j.error)}` + (j.needsInstall ? '' : '<button id="provRetry">Retry</button>'); const rb = $('provRetry'); if (rb) rb.onclick = runProvision; }
      }
    }
  } catch (e) { el.innerHTML = `<b>Setup failed</b>${esc(e.message)}`; }
}

async function loadBooks() {
  try { books = await fetch(API + '/api/rag/books').then((r) => r.json()); } catch { books = []; }
  if (!books.find((b) => b.id === selected) && selected !== ALL) selected = books[0] ? books[0].id : '';
  renderLib();
  const ready = books.length > 0;
  $('input').disabled = !ready; $('send').disabled = !ready || busy;
}

function renderLib() {
  const rows = [];
  if (books.length > 1) {
    rows.push(`<div class="book ${selected === ALL ? 'sel' : ''}" data-id="${ALL}">
      <span class="name">✦ All books</span><span class="meta">${books.length}</span></div>`);
  }
  for (const b of books) {
    rows.push(`<div class="book ${selected === b.id ? 'sel' : ''}" data-id="${b.id}">
      <span class="name" title="${esc(b.name)}">${esc(b.name.replace(/\.pdf$/i, ''))}</span>
      <span class="meta">${b.pages || '?'}p·${b.chunkCount}c</span>
      <button class="del" data-del="${b.id}" title="delete">✕</button></div>`);
  }
  $('lib').innerHTML = '<h4>library</h4>' + (rows.join('') || '<div class="idx">no books indexed</div>');
  $('lib').querySelectorAll('.book').forEach((el) => {
    el.onclick = (e) => { if (e.target.dataset.del) return; selected = el.dataset.id; renderLib(); $('input').focus(); };
  });
  $('lib').querySelectorAll('.del').forEach((el) => {
    el.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm('Delete this book from the index?')) return;
      await fetch(API + '/api/rag/books/' + el.dataset.del, { method: 'DELETE' });
      if (selected === el.dataset.del) selected = '';
      loadBooks();
    };
  });
}

async function upload(file) {
  if (!file) return;
  $('idx').style.display = 'block';
  $('idx').innerHTML = `indexing <b>${esc(file.name)}</b>… <div class="bar"><i></i></div>`;
  const t0 = performance.now();
  try {
    const fd = new FormData(); fd.append('file', file);
    const r = await fetch(API + '/api/rag/upload', { method: 'POST', body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'upload failed');
    const ms = performance.now() - t0;
    const cps = (j.chunkCount / (ms / 1000)).toFixed(1);
    $('idx').innerHTML = `indexed <b>${esc(j.name.replace(/\.pdf$/i, ''))}</b> · `
      + `${j.pages}p · ${j.chunkCount} chunks · ${(ms / 1000).toFixed(1)}s · ${cps} chunks/s`
      + (j.outline && j.outline.length ? ` · ${j.outline.length} bookmarks` : '');
    selected = j.id;
    await loadBooks();
  } catch (e) {
    $('idx').innerHTML = `<span class="err">index failed: ${esc(e.message)}</span>`;
  }
}

// turn an answer's [n] markers into clickable citations
function renderAnswer(text, cites) {
  const byLabel = {}; (cites || []).forEach((c) => { byLabel[c.label] = c; });
  return esc(text).replace(/\[(\d+)\]/g, (m, n) => {
    const c = byLabel[n];
    if (!c) return m;
    const bid = c.bookId || selected;
    const page = c.page ? '#page=' + c.page : '';
    return `<a class="cref" href="${API}/api/rag/pdf/${bid}${page}" target="_blank" title="${esc(c.snippet)}">[${n}]</a>`;
  });
}

function fmt(ms) { return ms == null ? '—' : (ms < 1000 ? ms.toFixed(0) + 'ms' : (ms / 1000).toFixed(2) + 's'); }

function renderMetrics(meta, done, cites) {
  if (!meta) return '';
  const t = meta.timings || {};
  const cells = [
    ['rewrite', fmt(t.rewriteMs)], ['embed', fmt(t.embedMs)], ['search', fmt(t.searchMs)],
    ['rerank', meta.reranked ? fmt(t.rerankMs) : 'off'], ['retrieval', fmt(t.retrievalMs)],
  ].map(([k, v]) => `<div class="cell"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  const gen = done ? [
    ['ttft', fmt(done.ttftMs)], ['generate', fmt(done.genMs)],
    ['tok/s', done.tokensPerSec != null ? `<span class="hi">${done.tokensPerSec}</span>` : '—'],
    ['tokens', done.tokens], ['total', `<span class="hi">${fmt(done.totalMs)}</span>`],
  ].map(([k, v]) => `<div class="cell"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('') : '';
  const chunkRows = (cites || []).map((c) =>
    `<div class="chunk"><div class="h">[${c.label}] <span class="score">score ${c.score}</span>`
    + `${c.page ? ' · p.' + c.page : ''}${c.bookName ? ' · ' + esc(c.bookName.replace(/\.pdf$/i, '')) : ''}</div>`
    + `${esc(c.snippet)}…</div>`).join('');
  return `<div class="metrics">
    <div class="row">${cells}</div>
    ${gen ? `<div class="row">${gen}</div>` : ''}
    <details class="chunks"><summary>${(cites || []).length} retrieved passages`
    + `${meta.rewritten ? ` · rewritten: "${esc(meta.rewritten)}"` : ''}</summary>${chunkRows}</details>
  </div>`;
}

async function ask(q) {
  if (!q || !selected || busy) return;
  busy = true; $('send').disabled = true; $('input').value = '';
  $('empty') && $('empty').remove();
  const turn = document.createElement('div');
  turn.className = 'turn';
  turn.innerHTML = `<div class="q">${esc(q)}</div><div class="a" data-a>…</div><div data-m></div>`;
  $('transcript').appendChild(turn);
  $('transcript').scrollTop = $('transcript').scrollHeight;
  const aEl = turn.querySelector('[data-a]'), mEl = turn.querySelector('[data-m]');

  // build history from prior turns
  const history = [];
  $('transcript').querySelectorAll('.turn').forEach((t) => {
    if (t === turn) return;
    const qq = t.querySelector('.q'), aa = t.querySelector('.a');
    if (qq) history.push({ role: 'user', content: qq.textContent.replace(/^›\s*/, '') });
    if (aa && aa.dataset.raw) history.push({ role: 'assistant', content: aa.dataset.raw });
  });

  let meta = null, cites = [], answer = '';
  try {
    const r = await fetch(API + '/api/rag/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bookId: selected, question: q, history }),
    });
    if (!r.ok) throw new Error(await r.text());
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const evts = buf.split('\n\n'); buf = evts.pop();
      for (const evt of evts) {
        const ev = evt.split('\n').find((l) => l.startsWith('event: '))?.slice(7);
        const dl = evt.split('\n').find((l) => l.startsWith('data: '))?.slice(6);
        if (!dl) continue;
        let j; try { j = JSON.parse(dl); } catch { continue; }
        if (ev === 'meta') { meta = j; mEl.innerHTML = renderMetrics(meta, null, cites); }
        else if (ev === 'citations') { cites = j; mEl.innerHTML = renderMetrics(meta, null, cites); }
        else if (ev === 'token') { answer += j.t; aEl.innerHTML = renderAnswer(answer, cites); $('transcript').scrollTop = $('transcript').scrollHeight; }
        else if (ev === 'done') { aEl.dataset.raw = answer; mEl.innerHTML = renderMetrics(meta, j, cites); }
        else if (ev === 'error') { aEl.innerHTML = `<span class="err">error: ${esc(j.error)}</span>`; }
      }
    }
  } catch (e) {
    aEl.innerHTML = `<span class="err">error: ${esc(e.message)}</span>`;
  } finally {
    busy = false; $('send').disabled = !books.length;
    $('transcript').scrollTop = $('transcript').scrollHeight;
  }
}

// wiring
$('file').onchange = (e) => upload(e.target.files[0]);
const drop = $('drop');
['dragover', 'dragenter'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) upload(f); });
$('send').onclick = () => ask($('input').value.trim());
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') ask($('input').value.trim()); });

loadStatus(); loadBooks(); loadProvision();
setInterval(loadStatus, 15000);
</script>
</body>
